<!DOCTYPE html>
<html lang="en" class="">

<head>
    <meta charset="utf-8" />

    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport"
    />

    <title>Community Portal - Login & Sign Up</title>

    <!-- Library Scripts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>

    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>

    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>

    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>


    <!-- Fonts -->
    <link

        rel="stylesheet"
    />

    <link

        rel="stylesheet"
    />


    <script id="tailwind-config">

        tailwind.config = {

            darkMode: "class",

            theme: {

                extend: {

                    colors: {

                        "on-surface": "#1d1d03",
                        "on-secondary-container": "#7a5354",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#4f4446",
                        "inverse-primary": "#e7bbc6",
                        "background": "#fefccf",
                        "secondary-container": "#fecbcb",
                        "surface-variant": "#e6e5b9",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#ecbaba",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#5c5d6e",
                        "primary": "#78555e",
                        "outline-variant": "#d3c3c5",
                        "surface-container-low": "#f8f6c9",
                        "error": "#ba1a1a",
                        "primary-container": "#ffd1dc",
                        "secondary": "#7b5455",
                        "on-primary-container": "#7a5761",

                    spacing: {

                        "xl": "80px",
                        "xs": "4px",

                        "base": "8px",

                        "lg": "48px"

                    },

                    fontFamily: {

                        "body-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "headline-xl": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "label-md": ["Plus Jakarta Sans"]

                    }

                }

            }

        };

    </script>


    <style>

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .bg-ethereal-gradient {

            background: linear-gradient(
                135deg,
                #FFFDD0 0%,
                #F9F9FF 50%,
                #FFD1DC 100%
            );

            background-size: 200% 200%;

            animation: gradientMove 15s ease infinite;

        }


        .glass-card,
        .glass-panel {

            background: rgba(255, 255, 255, 0.6);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.4);

        }


        .ethereal-shadow {

            box-shadow:
                0 10px 40px -10px
                rgba(255, 209, 220, 0.4);

        }


        .input-glow:focus {

            box-shadow:
                0 0 0 4px
                rgba(249, 249, 255, 0.5);

            border-color: #ffd1dc;

        }


        @keyframes blob {

            0% {

                transform:
                    translate(0px, 0px)
                    scale(1);

            }

            33% {

                transform:
                    translate(30px, -50px)
                    scale(1.1);

            }

            66% {

                transform:
                    translate(-20px, 20px)
                    scale(0.9);

            }

            100% {

                transform:
                    translate(0px, 0px)
                    scale(1);

            }

        }


        .animate-blob {

            animation: blob 7s infinite;

        }


        .animation-delay-2000 {

            animation-delay: 2s;

        }


        .animation-delay-4000 {

            animation-delay: 4s;

        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

        }

    </style>

</head>


<body class="font-body-md">

    <div id="root"></div>


    <script type="text/babel">

        const {
            useState,
            useEffect
        } = React;


        const {
            createRoot
        } = ReactDOM;


        const {
            MemoryRouter,
            Routes,
            Route,
            Link,
            useNavigate
        } = ReactRouterDOM;


        /*
        ========================================
        BACKEND URL
        ========================================
        */

        const API_URL = "http://localhost:3000";



        /*
        ========================================
        SIGN UP PAGE
        ========================================
        */

        const SignUpPage = () => {


            const navigate = useNavigate();


            const [loading, setLoading] = useState(false);



            const handleSubmit = async (e) => {

                e.preventDefault();


                /*
                e.target = form

                FormData تقرأ أي input
                عنده name=""
                */

                const formData =
                    new FormData(e.target);



                const name =
                    formData.get("name");


                const email =
                    formData.get("email");


                const password =
                    formData.get("password");



                console.log({

                    name,
                    email,
                    password

                });



                try {


                    setLoading(true);



                    /*
                    ==============================
                    Request to Backend
                    ==============================
                    */

                    const response =
                        await fetch(

                            `${API_URL}/user/signup`,

                            {

                                method: "POST",


                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },


                                body: JSON.stringify({

                                    name,
                                    email,
                                    password

                                })

                            }

                        );



                    /*
                    ناخد response body
                    اللي رجع من Express
                    */

                    const data =
                        await response.json();



                    console.log(
                        "Backend response:",
                        data
                    );



                    /*
                    response.ok

                    true لو status:
                    200 - 299
                    */

                    if (!response.ok) {

                        return alert(
                            data.message ||
                            "Failed to create account"
                        );

                    }



                    /*
                    لو التسجيل نجح
                    */

                    alert(
                        data.message ||
                        "Account created successfully"
                    );


                    navigate("/signin");


                } catch (error) {


                    console.error(
                        "Signup error:",
                        error
                    );


                    alert(
                        "Cannot connect to server"
                    );


                } finally {


                    setLoading(false);


                }

            };



            return (

                <div
                    className="
                    bg-background
                    min-h-screen
                    flex
                    items-center
                    justify-center
                    p-gutter
                    relative
                    overflow-hidden
                    text-on-surface
                    "
                >


                    {/* Background */}

                    <div
                        className="
                        absolute
                        top-0
                        left-0
                        w-full
                        h-full
                        pointer-events-none
                        overflow-hidden
                        z-0
                        "
                    >


                        <div
                            className="
                            absolute
                            -top-32
                            -left-32
                            w-96
                            h-96
                            bg-primary-container
                            rounded-full
                            mix-blend-multiply
                            filter
                            blur-3xl
                            opacity-30
                            animate-blob
                            "
                        >
                        </div>


                        <div
                            className="
                            absolute
                            top-1/4
                            -right-20
                            w-80
                            h-80
                            bg-secondary-container
                            rounded-full
                            mix-blend-multiply
                            filter
                            blur-3xl
                            opacity-30
                            animate-blob
                            animation-delay-2000
                            "
                        >
                        </div>


                    </div>



                    <main
                        className="
                        w-full
                        max-w-md
                        z-10
                        "
                    >


                        <div
                            className="
                            glass-card
                            rounded-lg
                            p-lg
                            ethereal-shadow
                            flex
                            flex-col
                            items-center
                            "
                        >


                            {/* Header */}

                            <div
                                className="
                                text-center
                                mb-lg
                                w-full
                                "
                            >


                                <span
                                    className="
                                    material-symbols-outlined
                                    text-primary
                                    text-5xl
                                    mb-sm
                                    "
                                    style={{
                                        fontVariationSettings:
                                            "'FILL' 1"
                                    }}
                                >

                                    volunteer_activism

                                </span>



                                <h1
                                    className="
                                    font-headline-lg
                                    text-primary
                                    text-3xl
                                    mb-xs
                                    "
                                >

                                    Create Account

                                </h1>


                                <p
                                    className="
                                    text-on-surface-variant
                                    "
                                >

                                    Join our lovely community

                                </p>


                            </div>



                            {/* SIGN UP FORM */}

                            <form
                                onSubmit={handleSubmit}
                                className="
                                w-full
                                space-y-md
                                "
                            >


                                {/* Name */}

                                <div className="space-y-xs">


                                    <label
                                        className="
                                        text-on-surface-variant
                                        block
                                        ml-sm
                                        "
                                        htmlFor="name"
                                    >

                                        Full Name

                                    </label>


                                    <div className="relative">


                                        <span
                                            className="
                                            material-symbols-outlined
                                            absolute
                                            left-sm
                                            top-1/2
                                            -translate-y-1/2
                                            text-outline
                                            "
                                        >

                                            person

                                        </span>


                                        <input

                                            className="
                                            w-full
                                            bg-surface-container-lowest
                                            border
                                            border-outline-variant
                                            rounded-full
                                            py-sm
                                            pl-[44px]
                                            pr-sm
                                            input-glow
                                            "

                                            id="name"

                                            name="name"

                                            placeholder="Ahmed Mohamed Ali"

                                            required

                                            type="text"

                                        />


                                    </div>

                                </div>



                                {/* Email */}

                                <div className="space-y-xs">


                                    <label
                                        htmlFor="signup-email"
                                        className="
                                        text-on-surface-variant
                                        block
                                        ml-sm
                                        "
                                    >

                                        Email

                                    </label>


                                    <div className="relative">


                                        <span
                                            className="
                                            material-symbols-outlined
                                            absolute
                                            left-sm
                                            top-1/2
                                            -translate-y-1/2
                                            text-outline
                                            "
                                        >

                                            mail

                                        </span>


                                        <input

                                            className="
                                            w-full
                                            bg-surface-container-lowest
                                            border
                                            border-outline-variant
                                            rounded-full
                                            py-sm
                                            pl-[44px]
                                            pr-sm
                                            input-glow
                                            "

                                            id="signup-email"

                                            name="email"

                                            placeholder="hello@example.com"

                                            required

                                            type="email"

                                        />


                                    </div>

                                </div>



                                {/* Password */}

                                <div className="space-y-xs">


                                    <label
                                        htmlFor="signup-password"
                                        className="
                                        text-on-surface-variant
                                        block
                                        ml-sm
                                        "
                                    >

                                        Password

                                    </label>


                                    <div className="relative">


                                        <span
                                            className="
                                            material-symbols-outlined
                                            absolute
                                            left-sm
                                            top-1/2
                                            -translate-y-1/2
                                            text-outline
                                            "
                                        >

                                            lock

                                        </span>


                                        <input

                                            className="
                                            w-full
                                            bg-surface-container-lowest
                                            border
                                            border-outline-variant
                                            rounded-full
                                            py-sm
                                            pl-[44px]
                                            pr-sm
                                            input-glow
                                            "

                                            id="signup-password"

                                            name="password"

                                            placeholder="••••••••"

                                            required

                                            type="password"

                                        />


                                    </div>

                                </div>



                                {/* Submit */}

                                <button

                                    className="
                                    w-full
                                    bg-primary-container
                                    text-on-primary-container
                                    rounded-full
                                    py-md
                                    mt-sm
                                    hover:scale-[1.02]
                                    active:scale-95
                                    transition-all
                                    duration-300
                                    flex
                                    justify-center
                                    items-center
                                    gap-xs
                                    disabled:opacity-50
                                    "

                                    type="submit"

                                    disabled={loading}

                                >


                                    {
                                        loading
                                            ? "Creating Account..."
                                            : "Sign Up"
                                    }


                                    <span
                                        className="
                                        material-symbols-outlined
                                        "
                                    >

                                        arrow_forward

                                    </span>


                                </button>


                            </form>



                            <div
                                className="
                                mt-lg
                                text-center
                                "
                            >


                                <p
                                    className="
                                    text-on-surface-variant
                                    "
                                >

                                    Already have an account?{" "}


                                    <Link
                                        className="
                                        text-primary
                                        underline
                                        "
                                        to="/signin"
                                    >

                                        Sign In

                                    </Link>


                                </p>


                            </div>


                        </div>


                    </main>


                </div>

            );

        };





        /*
        ========================================
        SIGN IN PAGE
        ========================================
        */

        const SignInPage = () => {


            const navigate = useNavigate();


            const [loading, setLoading] =
                useState(false);



            const handleSubmit = async (e) => {


                e.preventDefault();



                const formData =
                    new FormData(e.target);



                const email =
                    formData.get("email");


                const password =
                    formData.get("password");



                console.log({

                    email,
                    password

                });



                try {


                    setLoading(true);



                    /*
                    =============================
                    Login Request
                    =============================
                    */

                    const response =
                        await fetch(

                            `${API_URL}/user/login`,

                            {

                                method: "POST",


                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },


                                body: JSON.stringify({

                                    email,
                                    password

                                })

                            }

                        );



                    const data =
                        await response.json();



                    console.log(
                        "Login response:",
                        data
                    );



                    /*
                    لو email أو password غلط
                    backend ممكن يرجع 401
                    */

                    if (!response.ok) {


                        return alert(

                            data.message ||
                            "Invalid email or password"

                        );


                    }



                    /*
                    Login Successful
                    */

                    alert(

                        data.message ||
                        "Login successful"

                    );



                } catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    alert(
                        "Cannot connect to server"
                    );


                } finally {


                    setLoading(false);


                }


            };



            return (

                <div
                    className="
                    min-h-screen
                    bg-ethereal-gradient
                    text-on-surface
                    flex
                    flex-col
                    items-center
                    justify-center
                    p-md
                    md:p-lg
                    "
                >


                    {/* Header */}

                    <header
                        className="
                        fixed
                        top-0
                        w-full
                        flex
                        items-center
                        justify-between
                        px-md
                        py-sm
                        bg-transparent
                        z-50
                        "
                    >


                        <button

                            onClick={() =>
                                navigate(-1)
                            }

                            aria-label="Go back"

                            className="
                            w-10
                            h-10
                            rounded-full
                            flex
                            items-center
                            justify-center
                            "
                        >


                            <span
                                className="
                                material-symbols-outlined
                                text-primary
                                "
                            >

                                arrow_back

                            </span>


                        </button>


                        <h1
                            className="
                            text-primary
                            "
                        >

                            Welcome

                        </h1>


                        <div className="w-10 h-10">
                        </div>


                    </header>



                    <main
                        className="
                        w-full
                        max-w-md
                        mx-auto
                        relative
                        z-10
                        "
                    >


                        <div
                            className="
                            text-center
                            mb-lg
                            "
                        >


                            <h2
                                className="
                                text-4xl
                                font-bold
                                text-primary
                                mb-sm
                                "
                            >

                                Welcome Back

                            </h2>


                            <p
                                className="
                                text-on-surface-variant
                                "
                            >

                                Log in to your account

                            </p>


                        </div>



                        <div
                            className="
                            glass-panel
                            ethereal-shadow
                            rounded-[2rem]
                            p-lg
                            w-full
                            flex
                            flex-col
                            gap-md
                            "
                        >


                            {/* LOGIN FORM */}

                            <form
                                className="
                                flex
                                flex-col
                                gap-gutter
                                "
                                onSubmit={handleSubmit}
                            >


                                {/* Email */}

                                <div
                                    className="
                                    flex
                                    flex-col
                                    gap-base
                                    "
                                >


                                    <label
                                        htmlFor="login-email"
                                        className="
                                        ml-sm
                                        "
                                    >

                                        Email Address

                                    </label>


                                    <div className="relative">


                                        <span
                                            className="
                                            material-symbols-outlined
                                            absolute
                                            left-sm
                                            top-1/2
                                            -translate-y-1/2
                                            text-primary
                                            "
                                        >

                                            mail

                                        </span>


                                        <input

                                            className="
                                            w-full
                                            bg-[#FFFDD0]/80
                                            border
                                            border-[#FFD1DC]
                                            rounded-full
                                            py-3
                                            pl-12
                                            pr-4
                                            focus:outline-none
                                            "

                                            id="login-email"

                                            name="email"

                                            placeholder="hello@example.com"

                                            required

                                            type="email"

                                        />


                                    </div>


                                </div>



                                {/* Password */}

                                <div
                                    className="
                                    flex
                                    flex-col
                                    gap-base
                                    "
                                >


                                    <label
                                        htmlFor="login-password"
                                        className="ml-sm"
                                    >

                                        Password

                                    </label>


                                    <div className="relative">


                                        <span
                                            className="
                                            material-symbols-outlined
                                            absolute
                                            left-sm
                                            top-1/2
                                            -translate-y-1/2
                                            text-primary
                                            "
                                        >

                                            lock

                                        </span>


                                        <input

                                            className="
                                            w-full
                                            bg-[#FFFDD0]/80
                                            border
                                            border-[#FFD1DC]
                                            rounded-full
                                            py-3
                                            pl-12
                                            pr-4
                                            focus:outline-none
                                            "

                                            id="login-password"

                                            name="password"

                                            placeholder="••••••••"

                                            required

                                            type="password"

                                        />


                                    </div>


                                </div>



                                <div
                                    className="
                                    flex
                                    justify-end
                                    mt-[-8px]
                                    "
                                >


                                    <a
                                        className="
                                        text-tertiary
                                        hover:text-primary
                                        "
                                        href="#"
                                    >

                                        Forgot Password?

                                    </a>


                                </div>



                                <button

                                    className="
                                    w-full
                                    bg-primary-container
                                    text-on-primary-container
                                    rounded-full
                                    py-4
                                    mt-sm
                                    ethereal-shadow
                                    hover:scale-[1.02]
                                    active:scale-95
                                    transition-all
                                    duration-200
                                    disabled:opacity-50
                                    "

                                    type="submit"

                                    disabled={loading}

                                >


                                    {
                                        loading
                                            ? "Signing In..."
                                            : "Sign In"
                                    }


                                </button>


                            </form>



                            <div
                                className="
                                relative
                                flex
                                items-center
                                py-sm
                                "
                            >


                                <div
                                    className="
                                    flex-grow
                                    border-t
                                    border-outline-variant
                                    "
                                >
                                </div>


                                <span
                                    className="
                                    flex-shrink-0
                                    mx-4
                                    text-on-surface-variant
                                    "
                                >

                                    or continue with

                                </span>


                                <div
                                    className="
                                    flex-grow
                                    border-t
                                    border-outline-variant
                                    "
                                >
                                </div>


                            </div>


                        </div>



                        <div
                            className="
                            text-center
                            mt-lg
                            pb-xl
                            "
                        >


                            <p
                                className="
                                text-on-surface-variant
                                "
                            >

                                Don't have an account?{" "}


                                <Link
                                    className="
                                    text-primary
                                    underline
                                    "
                                    to="/"
                                >

                                    Sign Up

                                </Link>


                            </p>


                        </div>


                    </main>


                </div>

            );

        };





        /*
        ========================================
        APP
        ========================================
        */

        const App = () => {


            return (

                <MemoryRouter
                    initialEntries={["/"]}
                >


                    <Routes>


                        <Route
                            path="/"
                            element={<SignUpPage />}
                        />


                        <Route
                            path="/signin"
                            element={<SignInPage />}
                        />


                    </Routes>


                </MemoryRouter>

            );

        };





        /*
        ========================================
        RENDER APP
        ========================================
        */

        const container =
            document.getElementById("root");


        const root =
            createRoot(container);


        root.render(<App />);


    </script>

</body>

</html>
