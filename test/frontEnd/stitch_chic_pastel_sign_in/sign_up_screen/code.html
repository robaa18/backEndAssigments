<style>
        .glass-card {
            background: rgba(255, 253, 208, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);

            box-shadow: 0 10px 40px -10px rgba(255, 209, 220, 0.3);

    body {

    }

<body class="bg-background min-h-screen flex items-center justify-center p-gutter relative overflow-hidden font-body-md text-on-surface">
<!-- Decorative Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
<div class="absolute top-1/4 -right-20 w-80 h-80 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
<div class="absolute -bottom-40 left-1/3 w-[500px] h-[500px] bg-tertiary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-md z-10">
<div class="glass-card rounded-lg p-lg ethereal-shadow flex flex-col items-center">
<!-- Header -->
<div class="text-center mb-lg w-full">
<span class="material-symbols-outlined text-primary text-5xl mb-sm" style="font-variation-settings: 'FILL' 1;">
                    volunteer_activism
                </span>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">
                    Create Account
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Join our lovely community
                </p>
</div>
<!-- Form -->
<form id="signup-form" class="w-full space-y-md">
<!-- Name Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-sm" for="name">Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">
                            person
                        </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-full py-sm pl-[44px] pr-sm focus:outline-none focus:ring-0 input-glow transition-shadow duration-300" id="name" name="name" placeholder="Your name" required="" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-sm" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">
                            mail
                        </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-full py-sm pl-[44px] pr-sm focus:outline-none focus:ring-0 input-glow transition-shadow duration-300" id="email" name="email" placeholder="hello@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block ml-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">
                            lock
                        </span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-full py-sm pl-[44px] pr-sm focus:outline-none focus:ring-0 input-glow transition-shadow duration-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<p id="form-message" class="hidden text-center text-sm" role="alert"></p>
<button id="submit-button" class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full py-md mt-sm shadow-[0_4px_20px_rgba(255,209,220,0.5)] hover:scale-[1.02] active:scale-95 transition-all duration-300 flex justify-center items-center gap-xs" type="submit">
                    Sign Up
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<script>
const API_URL = "http://localhost:3000";
const signupForm = document.getElementById("signup-form");
const submitButton = document.getElementById("submit-button");
const formMessage = document.getElementById("form-message");

signupForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const formData = new FormData(signupForm);
  formMessage.classList.add("hidden");
  submitButton.disabled = true;
  submitButton.textContent = "Creating account...";

  try {
    const response = await fetch(`${API_URL}/user/signup`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: formData.get("name"),
        email: formData.get("email"),
        password: formData.get("password")
      })
    });
    const data = await response.json();
    formMessage.textContent = data.message || (response.ok ? "Account created successfully" : "Failed to create account");
    formMessage.className = `text-center text-sm ${response.ok ? "text-green-700" : "text-red-600"}`;
    if (response.ok) signupForm.reset();
  } catch (error) {
    formMessage.textContent = "Cannot connect to the server. Make sure the backend is running on port 3000.";
    formMessage.className = "text-center text-sm text-red-600";
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "Create Account";
  }
});
</script>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-label-md hover:opacity-80 transition-opacity underline decoration-primary/30 underline-offset-4" href="#">
                        Sign In
                    </a>
</p>
</div>
</div>
</main>
